name: Actualização de Streams
on:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  Update-streams:
    runs-on: ubuntu-latest
    steps:
    
      - name: checkout
        uses: actions/checkout@v5

      - name: update streams
        run: cd M3U && bash streams.sh

      - name: update total channels
        run: |
          cd M3U
          TOTAL=$(grep -c '^#EXTINF:-1' iptv_streams.m3u)
          DATETIME=$(date '+%Y-%m-%d %H:%M:%S')

          sed -i "s/^# (●) Total de Canais:.*/# (●) Total de Canais: $TOTAL/" iptv_streams.m3u
          sed -i "s/^# (●) Lista Actualizada a:.*/# (●) Lista Actualizada a: $DATETIME/" iptv_streams.m3u

      - name: setup git config
        run: |
          git config user.name "📺 "
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: commit
        run: |
          git pull origin main
          cd M3U && git add *.m3u
          git commit -m "Actualização de Streams"
          git push origin main
